class="bdg bdg-added"><rect width="40.55" height="16" x="356.45" y="188" rx="8"/><text x="376.73" y="199" text-anchor="middle">NEW</text></g></g><g class="cardsh"><rect width="372" height="52" x="32" y="300" class="card card-added" rx="10"/><rect width="26" height="26" x="46" y="313" class="chip" rx="7"/><g><text x="59" y="330.5" class="glyph" text-anchor="middle" style="font-size:11px;font-family:ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,monospace">{ }</text></g><text x="82" y="331" class="ntitle" font-size="13">question_mark feature gate</text><g class="bdg bdg-added"><rect width="40.55" height="16" x="356.45" y="292" rx="8"/><text x="376.73" y="303" text-anchor="middle">NEW</text></g></g><g class="cardsh"><rect width="372" height="52" x="456" y="300" class="card card-added" rx="10"/><rect width="26" height="26" x="470" y="313" class="chip" rx="7"/><g><text x="483" y="330.5" class="glyph" text-anchor="middle" style="font-size:11px;font-family:ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,monospace">{ }</text></g><text x="506" y="331" class="ntitle" font-size="13">Try desugaring</text><g class="bdg bdg-added"><rect width="40.55" height="16" x="780.45" y="292" rx="8"/><text x="800.73" y="303" text-anchor="middle">NEW</text></g></g><g class="cardsh"><rect width="372" height="52" x="456" y="404" class="card card-added" rx="10"/><rect width="26" height="26" x="470" y="417" class="chip" rx="7"/><g><text x="483" y="434.5" class="glyph" text-anchor="middle" style="font-size:11px;font-family:ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,monospace">{ }</text></g><text x="506" y="435" class="ntitle" font-size="13">HIR MatchSource::TryDesugar</text><g class="bdg bdg-added"><rect width="40.55" height="16" x="780.45" y="396" rx="8"/><text x="800.73" y="407" text-anchor="middle">NEW</text></g></g><g class="cardsh"><rect width="372" height="52" x="880" y="508" class="card card-modified" rx="10"/><rect width="26" height="26" x