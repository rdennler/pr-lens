<svg xmlns="http://www.w3.org/2000/svg" width="1708" height="492" aria-label="Add Ingress resource type to the experimental API (internal + v1)" role="img" viewBox="0 0 1708 492"><title>Add Ingress resource type to the experimental API (internal + v1)</title><desc>This PR defines a new Ingress/IngressList API object — the initial version of Kubernetes&apos; L7 load-balancing resource — as pure type scaffolding: it adds the Go structs (IngressSpec, IngressStatus, IngressRule, IngressPath, IngressBackend) to both the internal experimental API package and its versioned experimental/v1 counterpart, registers the new types with each package&apos;s runtime scheme, generates the deep-copy and bidirectional v1↔internal conversion functions the API machinery needs to store and serve them, and generates swagger field docs for the v1 type. IngressStatus reuses the existing core LoadBalancerStatus/LoadBalancerIngress types that Service already relies on, so this change also backfills deep-copy/convert functions for those types where the experimental package previously had no need to generate them. No REST storage, admission, or controller wiring is included yet — this is the type-definition groundwork only.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif}.lanebox{fill:rgba(110,118,129,.07)}.lanelabel{font-size:10px;font-weight:700;letter-spacing:.12em;fill:#9198a1}.card{fill:#1c2128;stroke:#3d444d;stroke-width:1}.card-added{stroke:#3fb950;stroke-opacity:.55}.card-modified{stroke:#d29922;stroke-opacity:.5}.context{opacity:.82}.ntitle{font-weight:600;fill:#e6edf3}.chip{fill:rgba(110,118,129,.18)}.glyph{fill:#9198a1}.glyph-stroke{stroke:#9198a1;stroke-width:1.4;fill:none}.bdg text{font-size:8.5px;font-weight:700;letter-spacing:.06em}.bdg rect{stroke-width:1}.bdg-added rect{fill:rgba(46,160,67,.15);stroke:rgba(63,185,80,.4)}.bdg-added text{fill:#3fb950}.bdg-modified rect{fill:rgba(187,128,9,.15);stroke:rgba(210,153,34,.4)}.bdg-modified text{fill:#d29922}.edge{fill:none;stroke-width:1.5}.edge-added{stroke:#3fb950}.hero{stroke-width:2.25}.glow{fill:none;stroke-width:7;opacity:.14}.lpill{fill:#0d1117;stroke:#21262d;stroke-width:1}.ltext{font-size:9.5px;font-weight:600;fill:#9198a1}.ltext-added{fill:#3fb950}.cardsh{filter:drop-shadow(0 1px 2px rgba(0,0,0,.28))}</style><defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="rgba(110,118,129,.22)"/></pattern><marker id="mk-added" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#3fb950" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mko-added" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="10" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#3fb950" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M2,1 L10,5 L2,9"/></marker><marker id="mk-modified" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#d29922" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mko-modified" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="10" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#d29922" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M2,1 L10,5 L2,9"/></marker><marker id="mk-removed" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#f85149" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mko-removed" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="10" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#f85149" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M2,1 L10,5 L2,9"/></marker><marker id="mk-neutral" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#6e7681" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mko-neutral" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="10" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#6e7681" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M2,1 L10,5 L2,9"/></marker></defs><rect width="1708" height="492" x="0" y="0" fill="#0d1117" rx="12"/><rect width="1708" height="492" x="0" y="0" fill="url(#dots)" rx="12"/><g><rect width="404" height="432" x="16" y="44" class="lanebox" rx="12"/><text x="32" y="68" class="lanelabel">VERSIONED API (EXPERIMENTAL/V1) · WIRE FORMAT</text><rect width="404" height="432" x="440" y="44" class="lanebox" rx="12"/><text x="456" y="68" class="lanelabel">CONVERSION MACHINERY · GENERATED</text><rect width="404" height="432" x="864" y="44" class="lanebox" rx="12"/><text x="880" y="68" class="lanelabel">INTERNAL API (EXPERIMENTAL) · SERVER-SIDE CANONIC…</text><rect width="404" height="432" x="1288" y="44" class="lanebox" rx="12"/><text x="1304" y="68" class="lanelabel">CORE API (PKG/API) · EXISTING TYPES</text></g><g><path marker-end="url(#mk-added)" d="M404,110 L413,110 C417.97,110 422,114.03 422,119 L422,205 C422,214.39 429.61,222 439,222 L456,222" class="edge edge-added"/><circle r="2.6" fill="#3fb950"><animateMotion dur="1.6s" path="M404,110 L413,110 C417.97,110 422,114.03 422,119 L422,205 C422,214.39 429.61,222 439,222 L456,222" repeatCount="indefinite"/></circle><path stroke="#3fb950" d="M828,222 L841,222 C848.18,222 854,227.82 854,235 L854,313 C854,320.18 859.82,326 867,326 L880,326" class="glow"/><path marker-end="url(#mk-added)" d="M828,222 L841,222 C848.18,222 854,227.82 854,235 L854,313 C854,320.18 859.82,326 867,326 L880,326" class="edge edge-added hero"/><circle r="3" fill="#3fb950"><animateMotion dur="2.1s" path="M828,222 L841,222 C848.18,222 854,227.82 854,235 L854,313 C854,320.18 859.82,326 867,326 L880,326" repeatCount="indefinite"/></circle><circle r="3" fill="#3fb950"><animateMotion begin="-1.4s" dur="2.1s" path="M828,222 L841,222 C848.18,222 854,227.82 854,235 L854,313 C854,320.18 859.82,326 867,326 L880,326" repeatCount="indefinite"/></circle><circle r="3" fill="#3fb950"><animateMotion begin="-0.7s" dur="2.1s" path="M828,222 L841,222 C848.18,222 854,227.82 854,235 L854,313 C854,320.18 859.82,326 867,326 L880,326" repeatCount="indefinite"/></circle><path marker-end="url(#mk-added)" d="M1066,352 L1066,404" class="edge edge-added"/><circle r="2.6" fill="#3fb950"><animateMotion dur="1.6s" path="M1066,352 L1066,404" repeatCount="indefinite"/></circle><path marker-end="url(#mk-added)" d="M218,144 L218,161 C218,170.39 210.39,178 201,178 L131,178 C126.03,178 122,182.03 122,187 L122,196" class="edge edge-added"/><path marker-end="url(#mk-added)" d="M218,144 L218,153 C218,157.97 222.03,162 227,162 L297,162 C306.39,162 314,169.61 314,179 L314,196" class="edge edge-added"/><path marker-end="url(#mk-added)" d="M1252,326 L1261,326 C1265.97,326 1270,330.03 1270,335 L1270,405 C1270,414.39 1277.61,422 1287,422 L1304,422" class="edge edge-added"/><path marker-end="url(#mk-added)" d="M404,126 L421,126 C430.39,126 438,133.61 438,143 L438,336 C438,354.78 453.22,370 472,370 L1252,370 C1270.78,370 1286,385.22 1286,404 L1286,429 C1286,433.97 1290.03,438 1295,438 L1304,438" class="edge edge-added"/></g><g><g class="cardsh"><rect width="372" height="52" x="32" y="92" class="card card-added" rx="10"/><rect width="26" height="26" x="46" y="105" class="chip" rx="7"/><g><text x="59" y="122.5" class="glyph" text-anchor="middle" style="font-size:11px;font-family:ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,monospace">{ }</text></g><text x="82" y="123" class="ntitle" font-size="13">Ingress type (v1)</text><g class="bdg bdg-added"><rect width="40.55" height="16" x="356.45" y="84" rx="8"/><text x="376.73" y="95" text-anchor="middle">NEW</text></g></g><g class="cardsh"><rect width="180" height="52" x="32" y="196" class="card card-modified" rx="10"/><rect width="26" height="26" x="46" y