<svg xmlns="http://www.w3.org/2000/svg" width="1284" height="596" aria-label="Rework &lt;script setup&gt; compiler: drop export-based bindings, add ref: sugar, and inline render function into setup()" role="img" viewBox="0 0 1284 596"><title>Rework &lt;script setup&gt; compiler: drop export-based bindings, add ref: sugar, and inline render function into setup()</title><desc>This PR rewrites the experimental &lt;script setup&gt; compiler in compiler-sfc: it removes the previous RFC&apos;s export-based mechanism for exposing bindings (export const/export {}/export * from) in favor of automatically exposing all top-level declarations, and adds an experimental `ref:` label sugar that rewrites `ref: x = 1` into `const x = ref(1)` and rewrites subsequent reads/writes of `x` to `x.value`. It also introduces an `inlineTemplate` compile option that compiles the SFC template and inlines its render function directly inside `setup()`. To support that inlining, compiler-core&apos;s transform/codegen pipeline gained a shared `inline` flag: codegen can now emit a bare arrow function plus a separately returned `preamble` instead of a standalone `function render()`, and the component/expression resolvers learned to unwrap ref-typed setup bindings via a new `UNREF` runtime helper or reference raw imports directly, instead of always going through `$setup[...]`. Test snapshots and specs were rewritten to match the new codegen output and the retired export-based test cases.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif}.lanebox{fill:rgba(110,118,129,.07)}.lanelabel{font-size:10px;font-weight:700;letter-spacing:.12em;fill:#9198a1}.card{fill:#1c2128;stroke:#3d444d;stroke-width:1}.card-modified{stroke:#d29922;stroke-opacity:.5}.context{opacity:.82}.ntitle{font-weight:600;fill:#e6edf3}.chip{fill:rgba(110,118,129,.18)}.glyph{fill:#9198a1}.glyph-stroke{stroke:#9198a1;stroke-width:1.4;fill:none}.bdg text{font-size:8.5px;font-weight:700;letter-spacing:.06em}.bdg rect{stroke-width:1}.bdg-modified rect{fill:rgba(187,128,9,.15);stroke:rgba(210,153,34,.4)}.bdg-modified text{fill:#d29922}.edge{fill:none;stroke-width:1.5}.edge-added{stroke:#3fb950}.edge-modified{stroke:#d29922}.hero{stroke-width:2.25}.glow{fill:none;stroke-width:7;opacity:.14}.lpill{fill:#0d1117;stroke:#21262d;stroke-width:1}.ltext{font-size:9.5px;font-weight:600;fill:#9198a1}.ltext-added{fill:#3fb950}.ltext-modified{fill:#d29922}.cardsh{filter:drop-shadow(0 1px 2px rgba(0,0,0,.28))}</style><defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="rgba(110,118,129,.22)"/></pattern><marker id="mk-added" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#3fb950" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mko-added" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="10" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#3fb950" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M2,1 L10,5 L2,9"/></marker><marker id="mk-modified" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#d29922" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mko-modified" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="10" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#d29922" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M2,1 L10,5 L2,9"/></marker><marker id="mk-removed" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#f85149" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mko-removed" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="10" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#f85149" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M2