<svg xmlns="http://www.w3.org/2000/svg" width="960" height="132" aria-label="Three steps: install the GitHub App on any repository, open a pull request, the diagram appears and is redrawn on every push" role="img" viewBox="0 0 960 132"><title>Install PR Lens in three steps</title><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif}.card{fill:#fff;stroke:#d1d9e0;stroke-width:1}.card-added{stroke:#1a7f37;stroke-opacity:.55}.chip{fill:#f6f8fa}.bdg text,.num{font-weight:700;fill:#1a7f37}.bdg text{font-size:8.5px;letter-spacing:.06em}.num{font-size:12px}.ntitle{font-weight:600;fill:#1f2328}.nsub{font-size:9.5px;fill:#59636e;font-family:ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,monospace}.bdg rect{fill:#dafbe1;stroke:rgba(31,136,61,.4);stroke-width:1}.edge{fill:none;stroke:#1a7f37;stroke-width:1.5}.cardsh{filter:drop-shadow(0 1px 2px rgba(31,35,40,.14))}</style><defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="rgba(140,149,159,.35)"/></pattern><marker id="mk-added" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#1a7f37" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="960" height="132" x="0" y="0" fill="#fff" rx="12"/><rect width="960" height="132" x="0" y="0" fill="url(#dots)" rx="12"/><path marker-end="url(#mk-added)" d="M292,66 L344,66" class="edge"/><circle r="3" fill="#1a7f37" class="pulse" opacity="0"><animateMotion calcMode="linear" dur="7.2s" keyPoints="0;0;1;1" keyTimes="0;0.0833;0.3333;1" path="M292,66 L344,66" repeatCount="indefinite"/><animate attributeName="opacity" dur="7.2s" keyTimes="0;0.0833;0.0889;0.3333;0.3389;1" repeatCount="indefinite" values="0;0;1;1;0;0"/></circle><path marker-end="url(#mk-added)" d="M616,66 L668,66" class="edge"/><circle r="3" fill="#1a7f37" class="pulse" opacity="0"><animateMotion calcMode="linear" dur="7.2s" keyPoints="0;0;1;1" keyTimes="0;0.375;0.625;1" path="M616,66 L668,66" repeatCount="indefinite"/><animate attributeName="opacity" dur="7.2s" keyTimes="0;0.375;0.3806;0.625;0.6306;1" repeatCount="indefinite" values="0;0;1;1;0;0"/></circle><g class="cardsh"><rect width="272" height="64" x="20" y="34" class="card" rx="10"/><rect width="26" height="26" x="34" y="52" class="chip" rx="7"/><text x="47" y="69.5" class="num" text-anchor="middle">1</text><text x="70" y="61" class="ntitle" font-size="13">Install the App</text><text x="70" y="79" class="nsub">on any repository</text></g><g class="cardsh"><rect width="272" height="64" x="344" y="34" class="card" rx="10"/><rect width="26" height="26" x="358" y="52" class="chip" rx="7"/><text x="371" y="69.5" class="num" text-anchor="middle">2</text><text x="394" y="61" class="ntitle" font-size="13">Open a pull request</text><text x="394" y="79" class="nsub">no key, no workflow file</text></g><g class="cardsh"><rect width="272" height="64" x="668" y="34" class="card card-added" rx="10"/><rect width="26" height="26" x="682" y="52" class="chip" rx="7"/><text x="695" y="69.5" class="num" text-anchor="middle">3</text><text x="718" y="61" class="ntitle" font-size="13">The diagram appears</text><text x="718" y="79" class="nsub">redrawn on every push</text><g class="bdg"><rect width="46" height="16" x="880" y="26" rx="8"/><text x="903" y="37" text-anchor="middle">DRAWN</text></g></g></svg>