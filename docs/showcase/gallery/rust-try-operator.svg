<svg xmlns="http://www.w3.org/2000/svg" width="1708" height="596" aria-label="Implement the `?` (question mark) try operator" role="img" viewBox="0 0 1708 596"><title>Implement the `?` (question mark) try operator</title><desc>Adds `expr?` as sugar for early-returning a `Result`&apos;s `Err` case, threaded through the full front-end pipeline: the parser recognizes a trailing `?` and produces a new `ExprKind::Try` AST node, which is gated behind an unstable `question_mark` feature, then desugared during AST-to-HIR lowering into a hygienic `match expr { Ok(val) =&gt; val, Err(err) =&gt; return Err(From::from(err)) }`. The desugared match is tagged with a new `MatchSource::TryDesugar` so the exhaustiveness checker treats an unreachable arm there as an internal compiler bug rather than a user-facing lint. The change also updates roughly a dozen existing parse-fail tests whose expected-token error messages now must include `?`, and adds new compile-fail/run-pass tests covering feature gating, ~20 syntactic positions, and hygiene.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif}.lanebox{fill:rgba(110,118,129,.07)}.lanelabel{font-size:10px;font-weight:700;letter-spacing:.12em;fill:#9198a1}.card{fill:#1c2128;stroke:#3d444d;stroke-width:1}.card-added{stroke:#3fb950;stroke-opacity:.55}.card-modified{stroke:#d29922;stroke-opacity:.5}.ntitle{font-weight:600;fill:#e6edf3}.chip{fill:rgba(110,118,129,.18)}.glyph{fill:#9198a1}.glyph-stroke{stroke:#9198a1;stroke-width:1.4;fill:none}.bdg text{font-size:8.5px;font-weight:700;letter-spacing:.06em}.bdg rect{stroke-width:1}.bdg-added rect{fill:rgba(46,160,67,.15);stroke:rgba(63,185,80,.4)}.bdg-added text{fill:#3fb950}.bdg-modified rect{fill:rgba(187,128,9,.15);stroke:rgba(210,153,34,.4)}.bdg-modified text{fill:#d29922}.edge{fill:none;stroke-width:1.5}.edge-added{stroke:#3fb950}.edge-modified{stroke:#d29922}.hero{stroke-width:2.25}.glow{fill:none;stroke-width:7;opacity:.14}.lpill{fill:#0d1117;stroke:#21262d;stroke-width:1}.ltext{font-size:9.5px;font-weight:600;fill:#9198a1}.ltext-added{fill:#3fb950}.ltext-modified{fill:#d29922}.cardsh{filter:drop-shadow(0 1px 2px rgba(0,0,0,.28))}</style><defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="rgba(110,118,129,.22)"/></pattern><marker id="mk-added" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#3fb950" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mko-added" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="10" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#3fb950" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M2,1 L10,5 L2,9"/></marker><marker id="mk-modified" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#d29922" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mko-modified" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="10" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#d29922" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M2,1 L10,5 L2,9"/></marker><marker id="mk-removed" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#f85149" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mko-removed" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="10" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#f85149" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M2,1 L10,5 L2,9"/></marker><marker id="mk-neutral" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#6e7681" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mko-neutral" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="10" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#6e7681" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M2,1 L10,5 L2,9"/></marker></defs><rect width="1708" height="596" x="0" y="0" fill="#0d1117" rx="12"/><rect width="1708" height="596" x="0" y="0" fill="url(#dots)" rx="12"/><g><rect width="404" height="536" x="16" y="44" class="lanebox" rx="12"/><text x="32" y="68" class="lanelabel">PARSING &amp; AST · LIBSYNTAX</text><rect width="404" height="536" x="440" y="44" class="lanebox" rx="12"/><text x="456" y="68" class="lanelabel">AST → HIR LOWERING · LIBRUSTC_FRONT</text><rect width="404" height="536" x="864" y="44" class="lanebox" rx="12"/><text x="880" y="68" class="lanelabel">SEMANTIC ANALYSIS · LIBRUSTC</text><rect width="404" height="536" x="1288" y="44" class="lanebox" rx="12"/><text x="1304" y="68" class="lanelabel">TESTS</text></g><g><path marker-end="url(#mk-added)" d="M218,144 L218,196" class="edge edge-added"/><circle r="2.6" fill="#3fb950"><animateMotion dur="1.6s" path="M218,144 L218,196" repeatCount="indefinite"/></circle><path marker-end="url(#mk-added)" d="M218,248 L218,300" class="edge edge-added"/><circle r="2.6" fill="#3fb950"><animateMotion dur="1.6s" path="M218,248 L218,300" repeatCount="indefinite"/></circle><path stroke="#3fb950" d="M404,222 L421,222 C430.39,222 438,229.61 438,239 L438,317 C438,321.97 442.03,326 447,326 L456,326" class="glow"/><path marker-end="url(#mk-added)" d="M404,222 L421,222 C430.39,222 438,229.61 438,239 L438,317 C438,321.97 442.03,326 447,326 L456,326" class="edge edge-added hero"/><circle r="3" fill="#3fb950"><animateMotion dur="2.1s" path="M404,222 L421,222 C430.39,222 438,229.61 438,239 L438,317 C438,321.97 442.03,326 447,326 L456,326" repeatCount="indefinite"/></circle><circle r="3" fill="#3fb950"><animateMotion begin="-1.4s" dur="2.1s" path="M404,222 L421,222 C430.39,222 438,229.61 438,239 L438,317 C438,321.97 442.03,326 447,326 L456,326" repeatCount="indefinite"/></circle><circle r="3" fill="#3fb