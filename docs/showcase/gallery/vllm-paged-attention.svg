<svg xmlns="http://www.w3.org/2000/svg" width="1284" height="908" aria-label="Implement PagedAttention V2" role="img" viewBox="0 0 1284 908"><title>Implement PagedAttention V2</title><desc>This PR splits the CUDA PagedAttention kernel into a V1 path (the original single-pass kernel, renamed) and a new V2 path that partitions long contexts across the grid&apos;s z-dimension, computing partial softmax statistics per partition and then combining them in a new reduction kernel. The Python attention layer now picks V1 or V2 at runtime with a simple heuristic (few partitions or a large batch × head count favors V1), allocates the extra exp_sums/max_logits/tmp_out scratch tensors V2 needs, and passes ALiBi slopes uniformly through a new get_alibi_slopes() hook shared by both the plain and ALiBi PagedAttention variants (removing the ALiBi subclass&apos;s separate kernel-call override). A new benchmark script and expanded kernel tests exercise both versions.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,&quot;Noto Sans&quot;,Helvetica,Arial,sans-serif}.lanebox{fill:rgba(110,118,129,.07)}.lanelabel{font-size:10px;font-weight:700;letter-spacing:.12em;fill:#9198a1}.card{fill:#1c2128;stroke:#3d444d;stroke-width:1}.card-added{stroke:#3fb950;stroke-opacity:.55}.card-modified{stroke:#d29922;stroke-opacity:.5}.ghost{opacity:.55}.ghost .card{stroke:#f85149;stroke-dasharray:4 3;stroke-opacity:.6}.ntitle{font-weight:600;fill:#e6edf3}.strike{text-decoration:line-through}.chip{fill:rgba(110,118,129,.18)}.glyph{fill:#9198a1}.glyph-stroke{stroke:#9198a1;stroke-width:1.4;fill:none}.bdg text{font-size:8.5px;font-weight:700;letter-spacing:.06em}.bdg rect{stroke-width:1}.bdg-added rect{fill:rgba(46,160,67,.15);stroke:rgba(63,185,80,.4)}.bdg-added text{fill:#3fb950}.bdg-modified rect{fill:rgba(187,128,9,.15);stroke:rgba(210,153,34,.4)}.bdg-modified text{fill:#d29922}.bdg-removed rect{fill:rgba(248,81,73,.12);stroke:rgba(248,81,73,.4)}.bdg-removed text{fill:#f85149}.edge{fill:none;stroke-width:1.5}.edge-added{stroke:#3fb950}.edge-modified{stroke:#d29922}.edge-removed{stroke:#f85149;stroke-dasharray:5 4;opacity:.7}.hero{stroke-width:2.25}.glow{fill:none;stroke-width:7;opacity:.14}.lpill{fill:#0d1117;stroke:#21262d;stroke-width:1}.ltext{font-size:9.5px;font-weight:600;fill:#9198a1}.ltext-added{fill:#3fb950}.ltext-removed{fill:#f85149}.cardsh{filter:drop-shadow(0 1px 2px rgba(0,0,0,.28))}</style><defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="rgba(110,118,129,.22)"/></pattern><marker id="mk-added" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#3fb950" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mko-added" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="10" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#3fb950" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M2,1 L10,5 L2,9"/></marker><marker id="mk-modified" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#d29922" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mko-modified" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="10" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#d29922" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M2,1 L10,5 L2,9"/></marker><marker id="mk-removed" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#f85149" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mko-removed" markerHeight="6.5" markerWidth="6.5" orient="auto-start-reverse" refX="10" refY="5" viewBox="0 0 10 10"><path fill="none" stroke="#f85149" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M2,1 L10,5 L2,9"/></marker><marker id="mk-neutral" markerHeight="6.5" markerWidth="6.5" orient="auto-start-rever